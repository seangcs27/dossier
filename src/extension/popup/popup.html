<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #d29922;

      --vanguard:   #14b8a6;
      --guard:      #ef4444;
      --defender:   #3b82f6;
      --sniper:     #f59e0b;
      --caster:     #8b5cf6;
      --medic:      #22c55e;
      --supporter:  #6b7280;
      --specialist: #ec4899;

      --r1: #6b7280; --r2: #6b7280; --r3: #3b82f6;
      --r4: #8b5cf6; --r5: #f59e0b; --r6: #ef4444;
    }

    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #search {
      flex: 1;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    #count {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .op-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .op-card:hover { border-color: var(--accent); }

    .op-avatar {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }
    .op-avatar-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--muted);
    }

    .op-info { padding: 6px; display: flex; flex-direction: column; gap: 3px; }
    .op-name {
      font-size: 11px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .op-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .op-class {
      font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
      padding: 1px 4px; border-radius: 3px; opacity: 0.9;
    }
    .op-class.vanguard   { background: var(--vanguard);   color: #fff; }
    .op-class.guard      { background: var(--guard);      color: #fff; }
    .op-class.defender   { background: var(--defender);   color: #fff; }
    .op-class.sniper     { background: var(--sniper);     color: #000; }
    .op-class.caster     { background: var(--caster);     color: #fff; }
    .op-class.medic      { background: var(--medic);      color: #000; }
    .op-class.supporter  { background: var(--supporter);  color: #fff; }
    .op-class.specialist { background: var(--specialist); color: #fff; }

    .op-rarity { font-size: 9px; letter-spacing: -1px; }
    .op-rarity.r1, .op-rarity.r2 { color: var(--r2); }
    .op-rarity.r3 { color: var(--r3); }
    .op-rarity.r4 { color: var(--r4); }
    .op-rarity.r5 { color: var(--r5); }
    .op-rarity.r6 { color: var(--r6); }

    .state-msg {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .state-msg .label { font-size: 15px; margin-bottom: 6px; color: var(--text); }

    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .detail { padding: 12px; }
    .btn-back {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .detail-header { display: flex; gap: 10px; align-items: flex-start; }
    .detail-avatar {
      width: 64px; height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }
    .detail-info { flex: 1; min-width: 0; }
    .detail-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .detail-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .detail-sub { font-size: 11px; color: var(--muted); }

    .detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .op-tag {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 6px;
    }

    .detail-desc {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
    }

    .detail-levels {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .detail-section-title {
      margin-top: 14px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .detail-skills { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .detail-skill {
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
    }
  </style>
</head>
<body>
  <header>
    <input type="search" id="search" placeholder="Search operators…" autocomplete="off">
    <span id="count"></span>
  </header>
  <main id="view"></main>
  <script src="popup.js"></script>
</body>
</html>
