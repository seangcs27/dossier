<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossier — Arknights</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <header>
      <h1><a href="#/" id="home"><img class="logo-mark" src="icons/icon-96.png" alt="" width="44" height="44">DOSSIER</a></h1>
      <div class="topbar-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input type="search" id="search" placeholder="Search operators…" autocomplete="off">
        </div>
        <button class="chip chip-action" id="more-toggle" aria-controls="more-filters" aria-expanded="false">
          <svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1.5 3.5h13M4 8h8M6.5 12.5h3"></path>
          </svg>
          <span id="more-label">Filters</span>
        </button>
      </div>
      <span id="count"></span>
    </header>
    <div id="more-filters" hidden></div>
  </div>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
