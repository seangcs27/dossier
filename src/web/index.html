<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossier — Arknights</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #d29922;

      --vanguard:   #14b8a6;
      --guard:      #ef4444;
      --defender:   #3b82f6;
      --sniper:     #f59e0b;
      --caster:     #8b5cf6;
      --medic:      #22c55e;
      --supporter:  #6b7280;
      --specialist: #ec4899;

      --r1: #6b7280; --r2: #6b7280; --r3: #3b82f6;
      --r4: #8b5cf6; --r5: #f59e0b; --r6: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Topbar (sticky) ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      flex-shrink: 0;
    }

    #search {
      flex: 1;
      max-width: 360px;
      padding: 6px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    #sort {
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #sort:focus { border-color: var(--accent); }

    /* ── Filter chips ── */
    #chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active { color: #fff; border-color: transparent; }
    .chip.c-vanguard.active   { background: var(--vanguard); }
    .chip.c-guard.active      { background: var(--guard); }
    .chip.c-defender.active   { background: var(--defender); }
    .chip.c-sniper.active     { background: var(--sniper); color: #000; }
    .chip.c-caster.active     { background: var(--caster); }
    .chip.c-medic.active      { background: var(--medic); color: #000; }
    .chip.c-supporter.active  { background: var(--supporter); }
    .chip.c-specialist.active { background: var(--specialist); }
    .chip.c-rarity.active     { background: var(--accent); color: #000; }
    .chip-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }

    #count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 10px;
      padding: 16px;
    }

    /* ── Operator card ── */
    .op-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .op-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .op-avatar {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }
    .op-avatar-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--muted);
    }

    .op-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .op-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .op-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .op-class {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 5px;
      border-radius: 3px;
      opacity: 0.9;
    }
    .op-class.vanguard   { background: var(--vanguard);   color: #fff; }
    .op-class.guard      { background: var(--guard);      color: #fff; }
    .op-class.defender   { background: var(--defender);   color: #fff; }
    .op-class.sniper     { background: var(--sniper);     color: #000; }
    .op-class.caster     { background: var(--caster);     color: #fff; }
    .op-class.medic      { background: var(--medic);      color: #000; }
    .op-class.supporter  { background: var(--supporter);  color: #fff; }
    .op-class.specialist { background: var(--specialist); color: #fff; }

    .op-rarity { font-size: 10px; letter-spacing: -1px; }
    .op-rarity.r1, .op-rarity.r2 { color: var(--r2); }
    .op-rarity.r3 { color: var(--r3); }
    .op-rarity.r4 { color: var(--r4); }
    .op-rarity.r5 { color: var(--r5); }
    .op-rarity.r6 { color: var(--r6); }

    /* ── States ── */
    .state-msg {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .state-msg .label { font-size: 18px; margin-bottom: 8px; }

    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail ── */
    .detail {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
    }
    .btn-back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .detail-header { display: flex; gap: 16px; align-items: flex-start; }
    .detail-avatar {
      width: 96px; height: 96px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }
    .detail-info { flex: 1; min-width: 0; }
    .detail-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .detail-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .detail-meta .op-class { font-size: 11px; padding: 2px 7px; }
    .detail-meta .op-rarity { font-size: 13px; }
    .detail-sub { font-size: 13px; color: var(--muted); }

    .detail-section {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .detail-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .detail-section p { font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
    .detail-section p:last-child { margin-bottom: 0; }
    .label-inline { color: var(--muted); }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .op-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 8px;
    }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .stats-table th, .stats-table td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .stats-table thead th { color: var(--muted); font-size: 11px; }
    .stats-table tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .stats-table tbody tr:last-child th,
    .stats-table tbody tr:last-child td { border-bottom: none; }
    .th-sub { font-weight: 400; opacity: 0.7; }

    .range-row { display: flex; gap: 24px; flex-wrap: wrap; }
    .range-block { display: flex; flex-direction: column; gap: 8px; }
    .range-label { font-size: 11px; color: var(--muted); }
    .range-grid { display: grid; gap: 2px; }
    .range-cell {
      width: 14px; height: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .range-cell.range-on { background: var(--accent); border-color: var(--accent); }
    .range-cell.range-op { background: var(--text); border-color: var(--text); }

    .detail-skill {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-skill:last-child { border-bottom: none; }
    .skill-icon {
      width: 40px; height: 40px;
      border-radius: 6px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .skill-icon-placeholder {
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 18px;
    }
    .skill-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .skill-meta { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
    .skill-desc { font-size: 13px; line-height: 1.5; }

    .detail-talent, .detail-base { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .detail-talent:last-child, .detail-base:last-child { border-bottom: none; }
    .talent-name, .base-name { font-size: 13px; font-weight: 600; }
    .talent-unlock, .base-unlock { font-size: 11px; color: var(--accent); margin: 2px 0 4px; }
    .talent-desc, .base-desc { font-size: 13px; line-height: 1.5; }

    .detail-pot {
      display: flex; gap: 10px; align-items: baseline;
      padding: 5px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .detail-pot:last-child { border-bottom: none; }
    .pot-rank { color: var(--accent); font-weight: 700; font-size: 11px; flex-shrink: 0; width: 24px; }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <h1>DOSSIER</h1>
      <input type="search" id="search" placeholder="Search operators…" autocomplete="off">
      <select id="sort" aria-label="Sort operators">
        <option value="release-desc" selected>Newest</option>
        <option value="release-asc">Oldest</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="rarity-desc">Rarity ↓</option>
        <option value="rarity-asc">Rarity ↑</option>
        <option value="class">Class</option>
      </select>
      <span id="count"></span>
    </header>
    <div id="chips">
      <button class="chip c-vanguard"   data-kind="class" data-value="PIONEER">Vanguard</button>
      <button class="chip c-guard"      data-kind="class" data-value="WARRIOR">Guard</button>
      <button class="chip c-defender"   data-kind="class" data-value="TANK">Defender</button>
      <button class="chip c-sniper"     data-kind="class" data-value="SNIPER">Sniper</button>
      <button class="chip c-caster"     data-kind="class" data-value="CASTER">Caster</button>
      <button class="chip c-medic"      data-kind="class" data-value="MEDIC">Medic</button>
      <button class="chip c-supporter"  data-kind="class" data-value="SUPPORT">Supporter</button>
      <button class="chip c-specialist" data-kind="class" data-value="SPECIAL">Specialist</button>
      <span class="chip-sep"></span>
      <button class="chip c-rarity" data-kind="rarity" data-value="6">6★</button>
      <button class="chip c-rarity" data-kind="rarity" data-value="5">5★</button>
      <button class="chip c-rarity" data-kind="rarity" data-value="4">4★</button>
      <button class="chip c-rarity" data-kind="rarity" data-value="3">3★</button>
      <button class="chip c-rarity" data-kind="rarity" data-value="2">2★</button>
      <button class="chip c-rarity" data-kind="rarity" data-value="1">1★</button>
    </div>
  </div>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
