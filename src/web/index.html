<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossier — Arknights</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <header>
      <h1><a href="#/" id="home">DOSSIER</a></h1>
      <input type="search" id="search" placeholder="Search operators…" autocomplete="off">
      <select id="sort" aria-label="Sort operators">
        <option value="release-desc" selected>Newest</option>
        <option value="release-asc">Oldest</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
      </select>
      <span id="count"></span>
    </header>
    <div id="chips">
      <button class="chip" data-kind="class" data-value="PIONEER">Vanguard</button>
      <button class="chip" data-kind="class" data-value="WARRIOR">Guard</button>
      <button class="chip" data-kind="class" data-value="TANK">Defender</button>
      <button class="chip" data-kind="class" data-value="SNIPER">Sniper</button>
      <button class="chip" data-kind="class" data-value="CASTER">Caster</button>
      <button class="chip" data-kind="class" data-value="MEDIC">Medic</button>
      <button class="chip" data-kind="class" data-value="SUPPORT">Supporter</button>
      <button class="chip" data-kind="class" data-value="SPECIAL">Specialist</button>
      <span class="chip-sep"></span>
      <button class="chip r6" data-kind="rarity" data-value="6">6★</button>
      <button class="chip r5" data-kind="rarity" data-value="5">5★</button>
      <button class="chip r4" data-kind="rarity" data-value="4">4★</button>
      <button class="chip r3" data-kind="rarity" data-value="3">3★</button>
      <button class="chip r2" data-kind="rarity" data-value="2">2★</button>
      <button class="chip r1" data-kind="rarity" data-value="1">1★</button>
      <span class="chip-sep"></span>
      <button class="chip chip-action" id="more-toggle" aria-controls="more-filters">Filters</button>
      <button class="chip chip-action" id="clear-filters" hidden>Clear</button>
    </div>
    <div id="more-filters" hidden></div>
  </div>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
