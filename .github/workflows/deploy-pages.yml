name: Deploy web SPA to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly, Sunday 00:00 UTC — refresh bundled operator data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # HellaAPI (awedtan.ca) is the one build source with no stand-in, and it has been
      # unreachable for days at a time. Restoring the last run's generated data gives the
      # build something to fall back on instead of failing; a run that reaches HellaAPI
      # regenerates the data and saves it under this run's own key.
      - uses: actions/cache@v4
        with:
          path: src/shared/generated
          key: generated-${{ github.run_id }}
          restore-keys: generated-
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
