name: Deploy web SPA to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # weekly, Sunday 00:00 UTC — refresh bundled operator data

permissions:
  contents: write # the image backup's release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build downloads ~60 MB of game-data tables from GitHub. Restoring the last run's
      # generated data means a bad fetch falls back to it instead of failing the deploy.
      - uses: actions/cache@v4
        id: cache
        with:
          path: src/shared/generated
          key: generated-${{ github.run_id }}
          restore-keys: generated-
      # GitHub drops a cache nobody has used for 7 days, and the build would then fetch every
      # picture again from sources that may have gone. So the baked images come back from the
      # last run's backup instead; the payloads are rebuilt from their sources either way.
      - if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p src/shared/generated
          gh release download image-backup -p images.tar -O - | tar -x -C src/shared/generated || echo "No image backup to restore"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build:web
      # Every image the build has baked, as one asset of the image-backup release (made on the
      # first run). The payloads are left out: they are rebuilt from their sources each run.
      - run: |
          tar -cf images.tar -C src/shared/generated --exclude='*.json' .
          gh release view image-backup > /dev/null 2>&1 || gh release create image-backup --latest=false \
            --title "Image backup" --notes "The images the last deploy baked, restored by the next one when its cache is gone."
          gh release upload image-backup images.tar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
